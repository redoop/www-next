name: Deploy static export to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # basePath 由「是否绑了自定义域名」自动推导, 不再需要人工维护变量:
      #   绑了域名  → 站点在根路径        → basePath = ""
      #   没绑域名  → github.io/<repo>/   → basePath = "/<repo>"
      # 之前的故障就是绑了域名却还留着 basePath=/www-next, 导致资源全 404。
      - name: Resolve basePath
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cname=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""' 2>/dev/null || echo "")
          if [ -n "$cname" ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "custom domain: $cname → basePath 为空"
          else
            echo "base_path=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
            echo "无自定义域名 → basePath=/${GITHUB_REPOSITORY#*/}"
          fi

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.base_path }}
        run: pnpm exec next build

      # GitHub Pages 的 Jekyll 会丢掉 `_` 开头的目录/文件(_next, __next.*.txt)
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
